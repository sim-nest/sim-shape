[package]
name = "sim-relation-shape"
version = "0.1.1"
edition = "2024"
license = "MPL-2.0"
description = "Shape projection and runtime admission for SIM relational records."
readme = "README.md"
publish = true
repository = "https://github.com/sim-nest/sim-shape"
homepage = "https://github.com/sim-nest/sim-shape"

[package.metadata.sim-recipes]
policy = "rustdoc"
reason = "The custom-domain binding specimen is checked in crate rustdoc and integration tests."

[dependencies]
sim-kernel = { version = "0.4.0" }
sim-relation-core = { version = "0.2.0" }
sim-relation-schema = { version = "0.2.0" }
sim-relation-plan = { version = "0.2.0" }
sim-relation-migrate = { version = "0.2.0" }
sim-shape = { version = "0.4.0", path = "../.." }

[dev-dependencies]
sim-kernel = { version = "0.4.0", features = ["test-support"] }

[lints]
workspace = true
