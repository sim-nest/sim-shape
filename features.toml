schema = "sim.features"

[enforcement.audience]
framework = "strict"
code = "strict"

[enforcement.specimen]
user = "strict"
framework = "strict"
code = "advisory"

[enforcement.route]
major_entrypoints = "advisory"
frameworks = "advisory"

[[feature]]
id = "feature/sim-shape/shape"
title = "Shape framework"
summary = "Define reusable Shape matching, binding, browse-only callable signatures, citizen projection, and grammar contracts for runtime values."
owner = "crate/sim-shape"
audiences = ["code", "framework"]
guidance = "Use this row when a framework needs a reusable matcher, object-accessible shape contract, or non-enforcing callable metadata consumed through the kernel browse slots. BrowseSignature preserves call and raw-call behavior; use FunctionObject only when Shape enforcement and overload selection are intended."
claims_anchors = [
  "anchor/crate/sim-shape",
  "anchor/export/sim-shape/shape/accept-on-no-diagnostics-hook",
  "anchor/export/sim-shape/shape/and",
  "anchor/export/sim-shape/shape/any",
  "anchor/export/sim-shape/shape/class",
  "anchor/export/sim-shape/shape/defs",
  "anchor/export/sim-shape/shape/discard-on-diagnostic-prefix-hook",
  "anchor/export/sim-shape/shape/exact-expr",
  "anchor/export/sim-shape/shape/expr-kind",
  "anchor/export/sim-shape/shape/hooked",
  "anchor/export/sim-shape/shape/list",
  "anchor/export/sim-shape/shape/live-hook",
  "anchor/export/sim-shape/shape/not",
  "anchor/export/sim-shape/shape/or",
  "anchor/export/sim-shape/shape/ref",
  "anchor/export/sim-shape/shape/repeat",
  "anchor/export/sim-shape/shape/score-floor-hook",
  "anchor/export/sim-shape/shape/table",
  "anchor/export/sim-shape/shape/trace-mark-hook",
  "anchor/export/sim-shape/shape/venn",
]
claims_specimens = [
  "spec-test/sim-shape/src/citizen/inventory",
]

[[feature]]
id = "feature/sim-shape/shape-recipes"
title = "Shape recipe crates"
summary = "Carry runnable Shape recipe crates used as checked examples for exact booleans and grammar contracts."
owner = "crate/sim-shape-recipe-exact-bool-shape"
audiences = ["code"]
guidance = "Use this row when a code example needs a standalone Shape recipe crate."
claims_anchors = [
  "anchor/crate/sim-shape-recipe-exact-bool-shape",
  "anchor/crate/sim-shape-recipe-shape-grammar-contract",
]
supports = [
  "feature/sim-shape/shape",
]

[[feature]]
id = "feature/sim-shape/contract-emitter"
title = "Shape contract emitter"
summary = "Emit generated repository contract and index fragments for Shape crates."
owner = "crate/xtask"
audiences = ["code"]
guidance = "Use this host-tool row when refreshing generated Shape contract evidence; it is OS/HW-neutral and remains outside every product closure."
claims_anchors = [
  "anchor/crate/xtask",
]
supports = [
  "feature/sim-shape/shape",
]

[[feature]]
id = "feature/sim-shape/relation-shape"
title = "Relational Shape projection"
summary = "Resolve open relational domains through Cx and project cells, rows, schemas, plans, migrations, bindings, and receipts as native inspectable Shape-bearing records."
owner = "crate/sim-relation-shape"
audiences = ["code", "framework"]
guidance = "Extend this framework for relational admission and binding. Keep domains as sim-relation-core data, resolve their declared Shape refs through Cx, and keep checked seals and live handles outside pure constructors; do not add a relation-private matcher or type registry."
claims_anchors = [
  "anchor/crate/sim-relation-shape",
  "anchor/rustdoc/sim-relation-shape/cell-shape",
  "anchor/rustdoc/sim-relation-shape/record-shape",
  "anchor/rustdoc/sim-relation-shape/row-shape",
  "anchor/rustdoc/sim-relation-shape/construct_record",
  "anchor/rustdoc/sim-relation-shape/resolve_domain_shape",
]
claims_specimens = [
  "spec-test/sim-shape/crates/sim-relation-shape/src/tests",
]
supports = [
  "feature/sim-shape/shape",
]

[[route]]
id = "route/add-shape-contract"
task = "Add a Shape contract"
audiences = ["code", "framework"]
steps = [
  { feature = "feature/sim-shape/shape", why = "The Shape row owns matching, binding, and citizen projection." },
  { feature = "feature/sim-shape/contract-emitter", why = "The emitter row keeps Shape contract evidence current." },
  { specimen = "spec-test/sim-shape/src/citizen/inventory", why = "The inventory test checks the exported shape citizen surface." },
]

[[route]]
id = "route/add-shape-recipe"
task = "Add a Shape recipe"
audiences = ["code"]
steps = [
  { feature = "feature/sim-shape/shape-recipes", why = "The recipe row owns standalone Shape example crates." },
  { feature = "feature/sim-shape/shape", why = "The Shape row owns the contract the recipe demonstrates." },
]

[[route]]
id = "route/bind-relational-domain"
task = "Bind a relational value through Shape"
audiences = ["code", "framework"]
steps = [
  { feature = "feature/sim-shape/relation-shape", why = "The relation adapter resolves DomainSpec Shape refs through Cx and owns cell/row binding." },
  { feature = "feature/sim-shape/shape", why = "The shared Shape protocol remains the only matcher and binder." },
  { specimen = "spec-test/sim-shape/crates/sim-relation-shape/src/tests", why = "The checked specimen binds a custom UUID-over-text domain and rejects a boolean mismatch." },
]
