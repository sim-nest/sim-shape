[package]
name = "sim-shape"
version = "0.2.4"
edition = "2024"
license = "MPL-2.0"
description = "Shape algebra, comparison, and match-hook helpers."
readme = "README.md"
publish = true
repository = "https://github.com/sim-nest/sim-shape"
homepage = "https://github.com/sim-nest/sim-shape"

[workspace]
resolver = "3"
members = [
  "crates/sim-relation-shape",
  "recipes/01-basics/exact-bool-shape",
  "recipes/01-basics/shape-grammar-contract",
  "xtask",
]

[workspace.package]
edition = "2024"
license = "MPL-2.0"
repository = "https://github.com/sim-nest/sim-shape"
homepage = "https://github.com/sim-nest/sim-shape"

[workspace.lints.rust]
unsafe_code = "forbid"

[patch.crates-io]
sim-shape = { path = "." }
sim-relation-core = { path = "../sim-foundation/crates/sim-relation-core" }
sim-relation-schema = { path = "../sim-foundation/crates/sim-relation-schema" }
sim-relation-plan = { path = "../sim-foundation/crates/sim-relation-plan" }
sim-relation-migrate = { path = "../sim-foundation/crates/sim-relation-migrate" }

[dependencies]
sim-citizen = { version = "0.2.0" }
sim-citizen-derive = { version = "0.2.0" }
sim-kernel = { version = "0.2.1" }

[dev-dependencies]
sim-kernel = { version = "0.2.1", features = ["test-support"] }
